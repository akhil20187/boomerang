<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Controlled MCP card check</title><style>body{font:14px system-ui;margin:24px}iframe{width:min(720px,100%);height:900px;border:1px solid #ddd}pre{white-space:pre-wrap}</style></head><body><h1>Controlled MCP host</h1><p>Sample listings only. Real calls and external requests are unavailable.</p><p id="status">Waiting for card handshake…</p><div id="mount"></div><pre id="events"></pre><script>
window.bridgeEvents=[];let initialized=0;const status=document.getElementById('status');
window.addEventListener('message',event=>{const message=event.data;if(message?.jsonrpc!=='2.0')return;bridgeEvents.push(message.method||'response');document.getElementById('events').textContent=bridgeEvents.join('\n');if(message.method==='ui/initialize'){initialized++;status.textContent='Handshake requests: '+initialized;event.source.postMessage({jsonrpc:'2.0',id:message.id,result:{protocolVersion:message.params.protocolVersion,hostInfo:{name:'Controlled widget host',version:'1.0.0'},hostCapabilities:{serverTools:{}},hostContext:{theme:'light',displayMode:'inline'}}},'*')}if(message.method==='ui/notifications/initialized'){status.textContent='Connected. Sample picker sent. No calls permitted.';event.source.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:{structuredContent:{draftId:'controlled-draft',product:{name:'Controlled sample phone'},pincode:'500037',attribution:'Google Maps',answerPriceCents:125,callingAvailable:false,callingUnavailableReason:'calling_disabled',callingUnavailableMessage:'Shop calling is not available yet. Your account has not been charged.',shops:Array.from({length:6},(_,i)=>({placeId:'controlled-place-'+i,name:'Controlled sample shop '+(i+1),rating:4.5,ratingCount:100,distanceKm:1,hours:'Hours unknown'}))}}},'*')}if(message.method==='tools/call'){status.textContent='Unexpected tool call blocked';event.source.postMessage({jsonrpc:'2.0',id:message.id,error:{code:-32601,message:'Calls disabled in controlled host'}},'*')}});
const frame=document.createElement('iframe');frame.setAttribute('sandbox','allow-scripts');frame.title='Isolated shop picker';frame.src='/dist/widget.html';document.getElementById('mount').appendChild(frame);
</script></body></html>
