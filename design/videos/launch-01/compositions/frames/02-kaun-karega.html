          [330, 680, "teal"], [1125, 720, "saffron"],
          [1700, 640, "saffron"]
        ];
        var BEATS = [1.95, 2.42, 2.89, 3.36, 3.83];
        var host = q("#" + P + "-stickers");
        var numHost = q("#" + P + "-num");
        var stickers = [], nums = [];
        SPOTS.forEach(function (s, i) {
          var el = document.createElement("div");
          el.className = P + "-sticker " + P + "-" + s[2];
          el.style.left = s[0] + "px";
          el.style.top = s[1] + "px";
          el.innerHTML = PHONE;
          host.appendChild(el);
          stickers.push(el);
        });
        for (var n = 2; n <= 10; n += 2) {
          var sp = document.createElement("span");
          sp.textContent = String(n);
          numHost.appendChild(sp);
          nums.push(sp);
        }

        // deterministic pseudo-random for the jitter
        var seed = 7;
        function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

        var slider = q("#" + P + "-slider");
        var A = q("#" + P + "-a"), B = q("#" + P + "-b"), C = q("#" + P + "-c");
        var pill = q("#" + P + "-pill");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 — handoff state: pink block centred, centre y=60%, scale 1, opacity 1, rot -3, static
        tl.fromTo(A, { rotation: -3, scale: 1, opacity: 1 }, { rotation: -3, scale: 1, opacity: 1, duration: 0.01 }, 0);
        tl.fromTo(B, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

        tl.fromTo(pill, { opacity: 0, scale: 0.6 }, { opacity: 0, scale: 0.6, duration: 0.01 }, 0);

        tl.fromTo(world, { scale: 1.0 }, { scale: 1.07, duration: 3.36, ease: "none" }, 0);

        // 0.54 — block slides up into the upper third (centre 648 -> ~290)

        // Scene 2 — 1.48 in-place swap to marigold question
        tl.set(A, { opacity: 0 }, 1.48);
        tl.fromTo(B, { opacity: 1, scale: 1.14, rotation: -2 },
          { opacity: 1, scale: 1, rotation: -2, duration: 0.32, ease: "back.out(2.4)" }, 1.48);

        // Scene 3 — 2.89 swap to saffron "10 DUKAAN. 10 CALLS."

          if (i > 0) tl.set(nums[i - 1], { opacity: 0 }, t);

              rotation: r0 + (rnd() - 0.5) * 18 * k,
