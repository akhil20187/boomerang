  <script>
    (function () {
      var P = "f04bpk-";
      var $ = function (n) { return document.getElementById(P + n); };
      var shot = $("shot"), scan = $("scan"), ring = $("ring"), ring2 = $("ring2");
      var H = 792; // screenshot height (CSS px)
      var tl = gsap.timeline({ paused: true });
      // reveal edge y (in screenshot px) → clip-path bottom inset + scan line position
      function reveal(y, at, dur) {
        tl.to(shot, { clipPath: "inset(0px 0px " + (H - y) + "px 0px)", duration: dur, ease: "power2.out" }, at);
        tl.to(scan, { y: y, duration: dur, ease: "power2.out" }, at);
      }

      // ---- Scene 1 (0.0–1.4): window whip-slide, staged mask reveal, headline slam, subline
      tl.fromTo($("window"), { x: 760, rotation: 3, skewX: -8 }, { x: 0, rotation: 0, skewX: 0, duration: 0.32, ease: "power4.out" }, 0);
      tl.fromTo($("stripe"), { scale: 0.4, rotation: -20 }, { scale: 1, rotation: -8, duration: 0.4, ease: "back.out(2)" }, 0.05);
      tl.fromTo($("star"), { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.2)" }, 0.2);
      // mask: header + user bubble first (y 140), then assistant line + card header (y 280)
      tl.fromTo(shot, { clipPath: "inset(0px 0px " + H + "px 0px)" }, { clipPath: "inset(0px 0px " + (H - 140) + "px 0px)", duration: 0.4, ease: "power2.out" }, 0.04);

      reveal(280, 0.47, 0.4);
      tl.fromTo($("head"), { scale: 1.7, opacity: 0, rotation: -9 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.22, ease: "power4.out" }, 0.47);
      tl.fromTo($("sub"), { y: 36, opacity: 0 }, { y: 0, opacity: 1, rotation: 1.5, duration: 0.22, ease: "power4.out" }, 0.47);

      // ---- Scene 2 (1.41–2.8): cascade down the five shop rows, one per half-beat
      var rowEdges = [369, 425, 481, 537, 595]; // bottom of each row incl. "5 shops" label above row 1
      for (var i = 0; i < rowEdges.length; i++) reveal(rowEdges[i], 1.41 + i * 0.235, 0.22);
      // button + footer note, then the rest of the window
      reveal(680, 2.48, 0.22);
      reveal(H, 2.68, 0.14);
      tl.to(scan, { opacity: 0, duration: 0.12, ease: "none" }, 2.7);
      tl.fromTo($("sticker"), { scale: 0, rotation: -18 }, { scale: 1, rotation: -6, duration: 0.42, ease: "back.out(2.2)" }, 1.88);

        tl.fromTo(ring2, { scale: 1, opacity: 0.9 }, { scale: 1.16, opacity: 0, duration: 0.4, ease: "power2.out" }, t + 0.1);
      });
      tl.set(ring, { opacity: 0 }, 0);
      tl.set(ring2, { opacity: 0 }, 0);
