<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #FFFFFF; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28" data-width="1920" data-height="1080">
      <div id="el-film" class="scene" data-composition-id="film" data-composition-src="compositions/film.html" data-start="0" data-duration="28" data-track-index="0"></div>

      <!-- Soundtrack: Lyria take-3 + phone ring + overlapping recreated sample calls (make-soundtrack.sh) -->
      <audio id="el-soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="28" data-track-index="11"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      window.__timelines["main"].to({}, { duration: 28 }, 0);
    </script>
  </body>
</html>
