<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55544F"/></marker>
<style>
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1A1A19}
.h{font-size:34px;font-weight:700;letter-spacing:-0.5px}
.k{font-size:17px;font-weight:600;letter-spacing:1.6px;fill:#55544F}
.t{font-size:24px;font-weight:600}
.b{font-size:21px;fill:#55544F}
.s{font-size:19px;fill:#55544F}
.w{fill:#FFFFFF}
.g{fill:#17573A;font-weight:600}
.am{fill:#7A4A00;font-weight:600}
.bl{fill:#2341B5;font-weight:600}
.box{fill:#FFFFFF;stroke:#DAD7D0;stroke-width:2}
.dark{fill:#1A1A19}
.ln{stroke:#55544F;stroke-width:2.5;fill:none}
.dash{stroke:#55544F;stroke-width:2.5;fill:none;stroke-dasharray:7 7}
.chipg{fill:#E6F0EA}.chipa{fill:#FBEFD9}.chipb{fill:#E6EBFA}.chipn{fill:#F2F1EE}
</style>
</defs>

<rect width="1600" height="640" fill="#FFFFFF"/>
<text x="40" y="70" class="k">HOW A REQUEST FLOWS</text>
<text x="40" y="116" class="h">From one sentence to shop-by-shop answers</text>

<!-- step boxes: x = 40, 348, 656, 964, 1272 ; w 288 -->
<g>
<rect x="40" y="160" width="288" height="300" rx="16" class="box"/>
<text x="68" y="206" class="k">STEP 1</text>
<text x="68" y="248" class="t">Ask</text>
<text x="68" y="292" class="b">“Plumber near 500032</text>
<text x="68" y="320" class="b">to fix a leaking tap”</text>
<text x="68" y="372" class="s">In ChatGPT, Claude,</text>
<text x="68" y="398" class="s">Codex or the</text>
<text x="68" y="424" class="s">Boomerang chat</text>
</g>
<line x1="328" y1="310" x2="344" y2="310" class="ln" marker-end="url(#a)"/>
<g>
<rect x="348" y="160" width="288" height="300" rx="16" class="box"/>
<text x="376" y="206" class="k">STEP 2</text>
<text x="376" y="248" class="t">Brief</text>
<text x="376" y="292" class="b">Asks only what the</text>
<text x="376" y="320" class="b">shop would ask you</text>
<text x="376" y="372" class="s">Writes the questions</text>
<text x="376" y="398" class="s">for the call: visit today?</text>
<text x="376" y="424" class="s">visit charge? rough cost?</text>
</g>
<line x1="636" y1="310" x2="652" y2="310" class="ln" marker-end="url(#a)"/>
<g>
<rect x="656" y="160" width="288" height="300" rx="16" class="box"/>
<text x="684" y="206" class="k">STEP 3</text>
<text x="684" y="248" class="t">Pick</text>
<text x="684" y="292" class="b">Google Maps finds</text>
<text x="684" y="320" class="b">nearby businesses</text>
<text x="684" y="372" class="s">Highest rated first.</text>
<text x="684" y="398" class="s">You tick who to call.</text>
<text x="684" y="424" class="s">That tick is the approval.</text>
</g>
<line x1="944" y1="310" x2="960" y2="310" class="ln" marker-end="url(#a)"/>
<g>
<rect x="964" y="160" width="288" height="300" rx="16" class="dark"/>
<text x="992" y="206" class="k" style="fill:#DAD7D0">STEP 4</text>
<text x="992" y="248" class="t w">Call</text>
<text x="992" y="292" class="b" style="fill:#FFFFFF">AI voice agent phones</text>
<text x="992" y="320" class="b" style="fill:#FFFFFF">each shop</text>
<text x="992" y="372" class="s" style="fill:#DAD7D0">English, Hindi, Telugu.</text>
<text x="992" y="398" class="s" style="fill:#DAD7D0">Enquiry only. No booking,</text>
<text x="992" y="424" class="s" style="fill:#DAD7D0">no payment, no address.</text>
</g>
<line x1="1252" y1="310" x2="1268" y2="310" class="ln" marker-end="url(#a)"/>
<g>
<rect x="1272" y="160" width="288" height="300" rx="16" class="box"/>
<text x="1300" y="206" class="k">STEP 5</text>
<text x="1300" y="248" class="t">Answers</text>
<text x="1300" y="292" class="b">Each question marked</text>
<text x="1300" y="320" class="b">answered or unconfirmed</text>
<text x="1300" y="372" class="s">With the shop's exact</text>
<text x="1300" y="398" class="s">words and the recording.</text>
<text x="1300" y="424" class="s g">₹10 only if they answer.</text>
</g>

<rect x="40" y="500" width="1520" height="96" rx="14" fill="#F2F1EE"/>
<text x="72" y="542" class="t">Unknown stays unknown.</text>
<text x="72" y="576" class="b">If a shop doesn't pick up, wants a personal call or can't answer, it is shown as unconfirmed and you aren't charged.</text>
</svg>
